name: Settimanale

on:
  schedule:
    - cron: "30 8 * * 0"
      timezone: "Europe/Rome"

permissions:
  contents: write

concurrency:
  group: dati
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CMAPI_KEY: ${{ secrets.CMAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Font per il PDF
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core fonts-noto-core fonts-liberation2 > /dev/null
      - name: Installa le librerie
        run: pip install -r requirements.txt PyMuPDF
      - name: Controllo del codice Python
        run: python -m py_compile main.py download_assets.py src/*.py
      - name: Esegui
        run: python -u main.py settimanale
      - name: Conserva PDF e diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POKEPUTZU-WEEKLY-PDF
          path: |
            output/*.pdf
            output/*_image_audit.json
            output/visual_review/*.png
          if-no-files-found: ignore
      - name: Salva i dati nel repository
        run: |
          git config user.name "tcg-bot"
          git config user.email "tcg-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dati $(date -u +%F)"
          git pull --rebase
          git push
      - name: Avviso su Telegram in caso di errore
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Bot TCG: errore in 'Settimanale'. Apri GitHub, scheda Actions, per i dettagli."
