name: Prova rivista PDF

on:
  workflow_dispatch:
  push:
    branches:
      - pokeputzu_redesign

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CMAPI_KEY: ${{ secrets.CMAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets['GEMINI_API_KEY'] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Font per il PDF
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core fonts-noto-core fonts-liberation2 > /dev/null
      - name: Installa le librerie
        run: pip install -r requirements.txt
      - name: Controllo del codice
        run: python -m py_compile main.py download_assets.py src/*.py
      - name: Genera PDF senza Telegram
        run: python main.py prova_rivista
      - name: Carica PDF di prova
        uses: actions/upload-artifact@v4
        with:
          name: POKEPUTZU-WEEKLY-PDF
          path: output/*.pdf
          if-no-files-found: error
